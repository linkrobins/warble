linkrobins-warble:
  admin:
    running: >
      Warble is running realtime on your forum over polling. There is nothing
      to connect: no key, no websocket server, no cron job. New posts, typing
      indicators and notifications reach visitors a few seconds after they
      happen. Realtime's own options (typing indicators, discussion-list
      updates, notification toasts) are on the Realtime extension's page.
    need_realtime: >
      Warble needs the "Realtime" extension. Enable flarum/realtime and Warble
      starts working straight away, with nothing else to set up.
    poll_interval_label: Polling interval (seconds)
    poll_interval_help: >
      How often each visitor's browser asks for updates. Lower is snappier and
      busier; higher is gentler on small hosting. Hidden tabs stop polling
      entirely, and tabs left idle for a few minutes check five times less
      often.
